services:
  - type: web
    name: syllogistique-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Applique les migrations Prisma avant de démarrer l'API à chaque déploiement
    startCommand: sh -c "npx prisma migrate deploy && node dist/main"
    envVars:
      - key: DATABASE_URL
        sync: false # à coller manuellement : la chaîne de connexion Neon
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGINS
        sync: false # l'adresse de ton site Netlify, ex : https://syllogistique-xxxx.netlify.app
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DEFAULT_TRUCK_FUEL_PRICE
        value: 10000
      - key: DEFAULT_SERVICE_VEHICLE_FUEL_PRICE
        value: 12000
