<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E2740">
<title>SYLLOGISTIQUE MASTER</title>
<style>
  :root{--navy:#163A5F;--navy-dark:#0E2740;--gold:#E0A72E;--bg:#F5F7FA;--text:#16233A;--muted:#6B7A8F;--line:#E4E9F0;--danger:#C0392B;--ok:#1E7B4B}
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{background:var(--navy-dark);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  header b{letter-spacing:.5px} header small{color:var(--gold);display:block;font-size:11px}
  main{max-width:560px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  h2{margin:0 0 10px;font-size:17px;color:var(--navy)} label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:15px}
  button,a.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-size:15px;margin-top:12px;cursor:pointer;text-decoration:none}
  button.gold{background:var(--gold);color:#1b1b1b} button.ghost{background:none;color:var(--navy);border:1px solid var(--line)}
  .err{color:var(--danger);font-size:13px;margin-top:8px;min-height:18px} .muted{color:var(--muted);font-size:13px}
  code{background:#EEF2F7;padding:3px 6px;border-radius:5px;word-break:break-all;font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px} .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .kpi b{font-size:22px;color:var(--navy);display:block} .kpi span{font-size:11px;color:var(--muted)}
  .codes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0} .codes code{text-align:center}
  table{width:100%;border-collapse:collapse;font-size:12px} td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
</style>
</head>
<body>
<header><div><b>SYLLOGISTIQUE</b><small>MASTER · accès privé</small></div><button id="out" class="ghost" style="display:none;margin:0;color:#fff;border-color:#3b5877" onclick="logout()">Déconnexion</button></header>
<main id="v"></main>
<script>
const v = document.getElementById('v');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function api(path, body) {
  const r = await fetch(path, { method: body === undefined ? 'GET' : 'POST', headers: { 'content-type': 'application/json', 'x-requested-with': 'master' }, body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || 'Erreur'); e.status = r.status; throw e; }
  return j;
}
const fail = (e) => { const x = document.getElementById('err'); if (x) x.textContent = e.message; };
function showLogin() {
  document.getElementById('out').style.display = 'none';
  v.innerHTML = `<div class="card"><h2>Connexion propriétaire</h2>
    <label>E-mail</label><input id="em" type="email" autocomplete="username">
    <label>Mot de passe</label><input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="err"></div><button onclick="doLogin()">Se connecter</button></div>`;
}
async function doLogin() {
  try { const r = await api('/api/login', { email: em.value, password: pw.value }); r.next === 'enroll' ? showEnroll() : showCode(); } catch (e) { fail(e); }
}
function showCode() {
  v.innerHTML = `<div class="card"><h2>Code de vérification</h2><p class="muted">Entrez le code à 6 chiffres de votre application d'authentification (ou un code de secours).</p>
    <input id="cd" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"><div class="err" id="err"></div><button onclick="doCode()">Valider</button></div>`;
}
async function doCode() { try { await api('/api/login/code', { code: cd.value }); showHome(); } catch (e) { fail(e); } }
async function showEnroll() {
  try {
    const s = await api('/api/2fa/setup');
    v.innerHTML = `<div class="card"><h2>Activer la double authentification</h2>
      <p class="muted">Obligatoire pour protéger toutes vos licences. Installez une application d'authentification (Google Authenticator, Microsoft Authenticator…).</p>
      <a class="btn gold" href="${esc(s.uri)}">Ouvrir mon application d'authentification</a>
      <p class="muted" style="margin-top:14px">Si rien ne s'ouvre, ajoutez ce compte manuellement avec cette clé :</p><code>${esc(s.secret)}</code>
      <label>Code à 6 chiffres affiché dans l'application</label><input id="cd" inputmode="numeric" placeholder="123456">
      <div class="err" id="err"></div><button onclick="doConfirm()">Activer</button></div>`;
  } catch (e) { showLogin(); }
}
async function doConfirm() {
  try {
    const r = await api('/api/2fa/confirm', { code: cd.value });
    v.innerHTML = `<div class="card"><h2>Codes de secours</h2><p class="muted"><b>Notez-les maintenant</b> dans un endroit sûr : ils ne seront plus jamais affichés. Chacun sert une seule fois si vous perdez votre téléphone.</p>
      <div class="codes">${r.codes.map((c) => `<code>${esc(c)}</code>`).join('')}</div><button onclick="showHome()">J'ai noté mes codes</button></div>`;
  } catch (e) { fail(e); }
}
async function showHome() {
  try {
    const me = await api('/api/me'); const log = await api('/api/audit');
    document.getElementById('out').style.display = 'inline-block';
    v.innerHTML = `<div class="card"><h2>Bienvenue, Monsieur SYLLA</h2><p class="muted">${esc(me.email)}</p></div>
      <div class="grid"><div class="kpi"><b>0</b><span>Clients</span></div><div class="kpi"><b>0</b><span>Licences</span></div><div class="kpi"><b>0</b><span>Appareils</span></div></div>
      <div class="card" style="margin-top:14px"><h2>Prochaines étapes</h2><p class="muted">Étape 2 : création des clients et des licences. Étape 3 : activation dans les installations clientes.</p></div>
      <div class="card"><h2>Changer mon mot de passe</h2><label>Mot de passe actuel</label><input id="c1" type="password"><label>Nouveau (12 caractères minimum)</label><input id="c2" type="password">
        <div class="err" id="err"></div><button onclick="doPw()">Modifier</button></div>
      <div class="card"><h2>Journal d'audit</h2><table>${log.map((l) => `<tr><td>${esc(new Date(l.at).toLocaleString('fr-FR'))}</td><td>${esc(l.action)}</td><td>${esc(l.ip || '')}</td></tr>`).join('')}</table></div>`;
  } catch (e) { showLogin(); }
}
async function doPw() { try { await api('/api/password', { current: c1.value, next: c2.value }); document.getElementById('err').style.color = 'var(--ok)'; document.getElementById('err').textContent = 'Mot de passe modifié.'; c1.value = c2.value = ''; } catch (e) { fail(e); } }
async function logout() { try { await api('/api/logout', {}); } catch (e) {} showLogin(); }
api('/api/me').then(showHome).catch(showLogin);
</script>
</body>
</html>
