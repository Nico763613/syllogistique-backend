<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E2740">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>SYL MASTER ADMIN</title>
<style>
  :root{--navy:#163A5F;--navy-dark:#0E2740;--gold:#E0A72E;--bg:#F5F7FA;--text:#16233A;--muted:#6B7A8F;--line:#E4E9F0;--danger:#C0392B;--ok:#1E7B4B}
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{background:var(--navy-dark);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  header b{letter-spacing:.5px} header small{color:var(--gold);display:block;font-size:11px}
  main{max-width:560px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  h2{margin:0 0 10px;font-size:17px;color:var(--navy)} label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:15px}
  button,a.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-size:15px;margin-top:12px;cursor:pointer;text-decoration:none}
  button.gold{background:var(--gold);color:#1b1b1b} button.ghost{background:none;color:var(--navy);border:1px solid var(--line)}
  .err{color:var(--danger);font-size:13px;margin-top:8px;min-height:18px} .muted{color:var(--muted);font-size:13px}
  code{background:#EEF2F7;padding:3px 6px;border-radius:5px;word-break:break-all;font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px} .kpi.click{cursor:pointer} .kpi.warn b{color:#B7791F} .kpi.bad b{color:var(--danger)} .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .kpi b{font-size:22px;color:var(--navy);display:block} .kpi span{font-size:11px;color:var(--muted)}
  .codes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0} .codes code{text-align:center}
  table{width:100%;border-collapse:collapse;font-size:12px} td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:6px} .bar h2{margin:0;flex:1}
  button.back{margin:0;padding:6px 14px;font-size:22px;line-height:1;background:none;color:var(--navy);border:1px solid var(--line)}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff;vertical-align:middle}
  .alert{background:#FFF6E0;border:1px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
  .yr{font-size:15px;font-weight:700;color:var(--navy);margin:8px 0}
  select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0} .chips button{margin:0;padding:6px 12px;font-size:13px}
  .chips button.on{background:var(--navy);color:#fff}
  button.danger{background:var(--danger);color:#fff}
  #modal{position:fixed;inset:0;background:rgba(14,39,64,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
  #modal .card{max-width:440px;width:100%;margin:0}
  .big{font-size:20px;letter-spacing:1px;text-align:center;display:block;padding:12px 8px;margin:10px 0}
  .spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:10px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* ===== Habillage « centre de commandement » ===== */
  :root{--blue:#2F5FA7;--side:#0B1F3A}
  .shell{display:flex;min-height:100vh}
  .sb{width:248px;flex:none;background:linear-gradient(180deg,#0B1F3A,#0A2A4D);color:#fff;display:flex;flex-direction:column;padding:14px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:20}
  .sb-logo{background:#fff;border-radius:12px;padding:8px 10px;margin-bottom:14px;display:flex;justify-content:center}
  .sb-logo img{width:100%;max-width:190px;height:auto;display:block}
  .sb a.it{display:flex;align-items:center;gap:10px;color:#DCE6F5;text-decoration:none;padding:10px 12px;border-radius:9px;font-size:14px;cursor:pointer;margin-bottom:2px}
  .sb a.it:hover{background:rgba(255,255,255,.08)} .sb a.it.on{background:var(--blue);color:#fff;font-weight:600}
  .sb a.it svg{flex:none} .sb a.it .ch{margin-left:auto;opacity:.6}
  .sb h6{margin:14px 12px 6px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#8FA6C6;font-weight:600}
  .sb hr{border:0;border-top:1px solid rgba(255,255,255,.12);margin:10px 4px}
  .sb button#out{background:#C0392B;width:100%;margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
  .mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{background:linear-gradient(90deg,#0B1F3A,#0E2F57);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px;position:sticky;top:0;z-index:15}
  .topbar .ttl{flex:1;min-width:0;border-left:1px solid rgba(255,255,255,.25);padding-left:14px}
  .topbar .ttl b{font-size:20px;letter-spacing:.3px;display:flex;align-items:center;gap:8px} .topbar .ttl small{color:#C8D6EC;font-size:12.5px;display:block}
  .topbar .tb{background:none;border:0;margin:0;padding:8px;color:#fff;border-radius:9px;display:inline-flex;position:relative;cursor:pointer}
  .topbar .tb:hover{background:rgba(255,255,255,.1)}
  .topbar .cnt{position:absolute;top:0;right:0;background:#E5484D;color:#fff;border-radius:99px;font-size:11px;min-width:17px;height:17px;line-height:17px;text-align:center;font-weight:700;padding:0 4px}
  .me{display:flex;align-items:center;gap:8px;font-size:12.5px;line-height:1.2} .me .av{width:38px;height:38px;border-radius:50%;background:#C9A24D;color:#0B1F3A;display:flex;align-items:center;justify-content:center;font-weight:800}
  #menu{display:none}
  main#v{max-width:860px;width:100%;margin:0 auto;padding:18px 16px;flex:1} main#v.wide{max-width:1240px}
  .foot{background:#0B1F3A;color:#C8D6EC;font-size:12.5px;display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 20px;flex-wrap:wrap}
  .foot i{opacity:.9} .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2BB673;margin-right:6px}
  body.guest .sb,body.guest .topbar,body.guest .foot{display:none} body.guest main#v{max-width:560px}
  .ban{position:relative;overflow:hidden;border-radius:14px;background:linear-gradient(100deg,#0B1F3A 0%,#12365F 55%,#C9742B 135%);color:#fff;padding:22px 24px;min-height:150px;box-shadow:0 6px 18px rgba(11,31,58,.18);margin-bottom:16px}
  .ban .pillw{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:99px;padding:5px 12px;font-size:12.5px}
  .ban h1{margin:10px 0 2px;font-size:30px;line-height:1.1} .ban p{margin:0;font-size:17px;color:#DCE6F5}
  .ban .tag{position:absolute;right:18px;bottom:10px;font-style:italic;font-size:12.5px;color:#E6EEF9} .ban svg.art{position:absolute;right:0;bottom:0;height:100%;max-width:60%}
  .ban .tx{position:relative;z-index:1}
  .kp6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
  .kc{border-radius:13px;padding:14px 10px;text-align:center;cursor:pointer;border:1px solid rgba(0,0,0,.06);box-shadow:0 2px 8px rgba(22,35,58,.06);transition:transform .12s}
  .kc:hover{transform:translateY(-2px)} .kc svg{display:block;margin:0 auto 6px} .kc b{display:block;font-size:30px;line-height:1.1;color:#16233A} .kc span{font-size:13px;color:#33435A}
  .c-blue{background:linear-gradient(160deg,#EAF1FF,#D9E6FB);color:#2F5FA7} .c-green{background:linear-gradient(160deg,#E7F7EE,#D3F0DF);color:#1E7B4B}
  .c-purple{background:linear-gradient(160deg,#F1EAFE,#E3D8FA);color:#6B3FC4} .c-orange{background:linear-gradient(160deg,#FFF1E0,#FFE2C2);color:#D9731A}
  .c-red{background:linear-gradient(160deg,#FFECEC,#FFD8D8);color:#D0393E} .c-cyan{background:linear-gradient(160deg,#E4F8FB,#CDEFF5);color:#1496AB} .c-indigo{background:linear-gradient(160deg,#E9ECFB,#D6DBF6);color:#2A3A9C}
  .two{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-bottom:16px} .two > .card{margin:0}
  .al{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer} .al:last-child{border:0}
  .al .ico{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
  .al .t{flex:1;font-size:13.5px;line-height:1.3} .al .d{font-size:12px;color:var(--muted);white-space:nowrap}
  .sp8{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .sp{border-radius:13px;padding:14px 12px;text-align:center;border:1px solid rgba(0,0,0,.06);box-shadow:0 2px 8px rgba(22,35,58,.06);cursor:pointer;display:flex;flex-direction:column;align-items:center}
  .sp .ib{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:8px} .sp b{font-size:15px;color:#16233A} .sp small{font-size:12.5px;color:#4A5A72;margin:4px 0 10px;min-height:32px}
  .sp .go{background:#0B2A55;color:#fff;border-radius:8px;padding:6px 16px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
  .stbar{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:linear-gradient(90deg,#EAF1FF,#E7F7EE);border:1px solid var(--line);border-radius:13px;padding:12px 16px;margin-bottom:6px}
  .stbar .ok{background:#1E9E5A;color:#fff;border-radius:99px;padding:3px 12px;font-size:12.5px;font-weight:700}
  .stbar .cell{display:flex;gap:8px;align-items:center;font-size:12.5px;color:#33435A;border-left:1px solid #C7D3E6;padding-left:16px}
  h3.sec{display:flex;gap:8px;align-items:center;margin:4px 0 10px;font-size:17px;color:var(--navy)}
  @media(max-width:1180px){.kp6{grid-template-columns:repeat(3,1fr)} .sp8{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:980px){
    .sb{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.4)} body.sb-open .sb{transform:none}
    body.sb-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:19} #menu{display:inline-flex}
    .two{grid-template-columns:1fr}
  }
  @media(max-width:640px){
    .topbar{padding:8px 10px;gap:6px} .topbar .ttl{padding-left:8px} .topbar .ttl b{font-size:15px} .topbar .ttl small{display:none} .me span{display:none} #fs{display:none}
    .ban{padding:16px} .ban h1{font-size:22px} .ban p{font-size:14px} .ban svg.art{opacity:.35} .ban .tag{display:none}
    .kp6{grid-template-columns:repeat(2,1fr);gap:10px} .kc b{font-size:26px} .sp8{gap:10px} .sp small{min-height:0} .stbar .cell{border:0;padding:0}
    .foot{justify-content:center;text-align:center} main#v{padding:12px 10px}
  }
</style>
</head>
<body class="guest">
<div class="shell">
  <aside class="sb" id="sb" aria-label="Navigation">
    <div class="sb-logo"><img src="/logo-syl.png" alt="SYL LOGISTIQUE"></div>
    <div id="sbnav"></div>
    <h6>Outils</h6>
    <a class="it" onclick="exportBox()"><span data-ic="download"></span> Export CSV</a>
    <a class="it" onclick="nav('global')"><span data-ic="chart"></span> Rapports</a>
    <hr><h6>Administration</h6>
    <a class="it" onclick="nav('password')"><span data-ic="lock"></span> Changer mot de passe</a>
    <a class="it" onclick="nav('audit')"><span data-ic="list"></span> Journal d'audit</a>
    <button id="out" onclick="logout()" style="display:none"><span data-ic="power"></span> Déconnexion</button>
  </aside>
  <div class="mainwrap">
    <div class="topbar">
      <button class="tb" id="menu" onclick="document.body.classList.toggle('sb-open')" aria-label="Menu"><span data-ic="menu" data-s="24"></span></button>
      <div class="ttl"><b>SYL MASTER ADMIN <svg width="22" height="22" viewBox="0 0 24 24" fill="#E0A72E" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg></b><small>Centre de Commandement de SYL LOGISTIQUE</small></div>
      <button class="tb" id="rfb" onclick="actualiser()" aria-label="Actualiser" title="Actualiser"><span data-ic="refresh" data-s="22"></span><span class="rft" style="font-size:13px;margin-left:5px;font-weight:600">Actualiser</span></button>
      <button class="tb" id="bellb" onclick="bellGo()" aria-label="Alertes"><span data-ic="bell" data-s="24"></span><span class="cnt" id="bellc" style="display:none"></span></button>
      <button class="tb" id="fs" onclick="toggleFs()" aria-label="Plein écran"><span data-ic="max" data-s="22"></span></button>
      <div class="me"><div class="av" id="avt">MS</div><span>Bonjour,<br><b>M. SYLLA</b></span></div>
    </div>
    <main id="v" class="wide"></main>
    <div class="foot"><span><b>SYL LOGISTIQUE</b> © <span id="yr"></span> — Tous droits réservés</span><i>Ensemble, bâtissons une logistique plus moderne et plus performante</i><span><span id="ver"></span> <span class="dot" id="onl"></span><span id="onlt">En ligne</span></span></div>
  </div>
</div>


<div id="modal"></div>
<script>
const v = document.getElementById('v');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function api(path, body) {
  const r = await fetch(path, { method: body === undefined ? 'GET' : 'POST', headers: { 'content-type': 'application/json', 'x-requested-with': 'master' }, body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || 'Erreur'); e.status = r.status; throw e; }
  return j;
}
const fail = (e) => { if (e.status === 401 && LOGGED) { return expired(); } const x = $('err'); if (x) x.textContent = e.message; else alert(e.message); };
let LOGGED = false, CL = [], FQ = '', FS = 'all';

/* ---------- navigation : flèche ← et bouton Retour du téléphone ---------- */
function nav(r, a) { history.pushState({ r, a }, ''); render({ r, a }); }
function back() { if (history.state && history.state.r && history.state.r !== 'home') history.back(); else showHome(); }
window.addEventListener('popstate', (e) => { closeModal(); if (LOGGED) render(e.state || { r: 'home' }); });
function render(st) {
  window.scrollTo(0, 0);
  if (LOGGED) { CUR = st.r; v.className = st.r === 'home' ? 'wide' : ''; paintSide(); document.body.classList.remove('sb-open'); }
  const f = { home: showHome, clients: showClients, licences: showLicences, finance: showFinance, supervision: showSupervision, security: showSecurity, config: showConfig, client: screenClient, license: screenLicense, extend: screenExtend, devices: screenDevices, password: screenPassword, audit: screenAudit, reset: screenReset, reports: screenReports, mails: screenMails, backups: screenBackups, global: screenGlobal, baraka: showBaraka }[st.r] || showHome;
  return f(st.a);
}
const bar = (t) => `<div class="bar"><button class="back" onclick="back()" aria-label="Retour" title="Retour">←</button><h2>${esc(t)}</h2></div>`;

/* ---------- fenêtres ---------- */
function closeModal() { const m = $('modal'); m.style.display = 'none'; m.innerHTML = ''; }
function openModal(html) { const m = $('modal'); m.innerHTML = `<div class="card">${html}</div>`; m.style.display = 'flex'; }
function confirmBox(text, ok = 'Supprimer') {
  return new Promise((res) => {
    openModal(`<h2>Confirmation</h2><p>${esc(text)}</p><button class="ghost" id="cn">Annuler</button> <button class="danger" id="cy">${esc(ok)}</button>`);
    $('cn').onclick = () => { closeModal(); res(false); }; $('cy').onclick = () => { closeModal(); res(true); };
  });
}
function copyText(t, btn) {
  const done = () => { if (btn) btn.textContent = 'Copié'; };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, () => fb()); else fb();
  function fb() { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} ta.remove(); }
}
function codeModal(code) {
  openModal(`<h2>Code d'activation</h2><p class="muted">Voici le code <b>complet</b>. Il ne sera plus jamais affiché : copiez-le maintenant et envoyez-le au client. Il est valable pour une seule installation.</p>
    <code class="big" id="fullcode">${esc(code)}</code>
    <button class="gold" id="cp">Copier</button> <button class="ghost" id="rt">Retour</button>`);
  $('cp').onclick = () => copyText(code, $('cp'));
  $('rt').onclick = () => { closeModal(); showClients(); };
}

/* ---------- déconnexion automatique après 15 minutes d'inactivité ---------- */
let idleT = null;
function bump() { clearTimeout(idleT); if (LOGGED) idleT = setTimeout(expired, 15 * 60000); }
['click', 'keydown', 'touchstart', 'scroll', 'mousemove'].forEach((ev) => window.addEventListener(ev, bump, { passive: true }));
async function expired() { try { await api('/api/logout', {}); } catch (e) {} showLogin('Session fermée après 15 minutes d\'inactivité. Reconnectez-vous.'); }

/* ---------- connexion ---------- */
function showLogin(msg) {
  LOGGED = false; clearTimeout(idleT); closeModal(); document.body.classList.add('guest'); v.className = '';
  $('out').style.display = 'none';
  v.innerHTML = `<div class="card"><img src="/master.webp" alt="MASTER ADMIN" style="width:min(260px,80%);display:block;margin:0 auto 6px"><h2 style="text-align:center">SYL MASTER ADMIN</h2><div style="text-align:center;color:var(--muted);font-size:13px;margin-bottom:6px">Connexion propriétaire</div>
    <label>E-mail</label><input id="em" type="email" autocomplete="username">
    <label>Mot de passe</label><input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="err">${esc(msg || '')}</div><button onclick="doLogin()">Se connecter</button></div>`;
}
async function doLogin() {
  try { const r = await api('/api/login', { email: em.value, password: pw.value }); r.next === 'enroll' ? showEnroll() : showCode(); } catch (e) { fail(e); }
}
function showCode() {
  v.innerHTML = `<div class="card"><h2>Code de vérification</h2><p class="muted">Entrez le code à 6 chiffres de votre application d'authentification (ou un code de secours).</p>
    <input id="cd" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"><div class="err" id="err"></div><button onclick="doCode()">Valider</button></div>`;
}
async function doCode() { try { await api('/api/login/code', { code: cd.value }); LOGGED = true; history.replaceState({ r: 'home' }, ''); showHome(); } catch (e) { fail(e); } }
async function showEnroll() {
  try {
    const s = await api('/api/2fa/setup');
    v.innerHTML = `<div class="card"><h2>Activer la double authentification</h2>
      <p class="muted">Obligatoire pour protéger toutes vos licences. Installez une application d'authentification (Google Authenticator, Microsoft Authenticator…).</p>
      <a class="btn gold" href="${esc(s.uri)}">Ouvrir mon application d'authentification</a>
      <p class="muted" style="margin-top:14px">Si rien ne s'ouvre, ajoutez ce compte manuellement avec cette clé :</p><code>${esc(s.secret)}</code>
      <label>Code à 6 chiffres affiché dans l'application</label><input id="cd" inputmode="numeric" placeholder="123456">
      <div class="err" id="err"></div><button onclick="doConfirm()">Activer</button></div>`;
  } catch (e) { showLogin(); }
}
async function doConfirm() {
  try {
    const r = await api('/api/2fa/confirm', { code: cd.value }); LOGGED = true;
    v.innerHTML = `<div class="card"><h2>Codes de secours</h2><p class="muted"><b>Notez-les maintenant</b> dans un endroit sûr : ils ne seront plus jamais affichés. Chacun sert une seule fois si vous perdez votre téléphone.</p>
      <div class="codes">${r.codes.map((c) => `<code>${esc(c)}</code>`).join('')}</div><button onclick="history.replaceState({r:'home'},'');showHome()">J'ai noté mes codes</button></div>`;
  } catch (e) { fail(e); }
}

/* ---------- accueil ---------- */
const STL = { PENDING: ['En attente', '#B7791F'], ACTIVE: ['Active', 'var(--ok)'], SUSPENDED: ['Suspendue', '#B7791F'], REVOKED: ['Révoquée', 'var(--danger)'], EXPIRED: ['Expirée', 'var(--danger)'] };
const pill = (k) => { const st = STL[k] || [k, '#666']; return `<span class="pill" style="background:${st[1]}">${st[0]}</span>`; };
const fd = (d) => (d ? new Date(d).toLocaleDateString('fr-FR') : '—');
const fdl = (d) => new Date(d).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
// statut global d'un client, d'après ses licences
function clientState(c) {

/* ---------- alertes réelles ---------- */
async function buildAlerts() {
  const out = []; const today = fd(new Date());
  expiring().sort((a, b) => new Date(a.l.expiresAt) - new Date(b.l.expiresAt)).forEach(({ c, l }) => {
    const d = Math.max(0, Math.ceil((new Date(l.expiresAt) - Date.now()) / 864e5));
    out.push({ lvl: d <= 7 ? 'red' : 'orange', t: `<b>${esc(c.name)}</b> : licence n°${l.id} expire ${d === 0 ? 'aujourd\'hui' : 'dans ' + d + ' jour' + (d > 1 ? 's' : '')}`, d: fd(l.expiresAt), go: `nav('extend',${l.id})` });
  });
  const lost = lic().filter((l) => ['EXPIRED', 'SUSPENDED'].includes(l.effective)).length;
  if (lost) out.push({ lvl: 'orange', t: `<b>${lost} licence(s)</b> expirée(s) ou suspendue(s)`, d: today, go: "goLic('EXPIRED')" });
  const unpaid = lic().filter((l) => !l.paymentConfirmed && !['REVOKED', 'EXPIRED'].includes(l.effective)).length;
  if (unpaid) out.push({ lvl: 'orange', t: `<b>${unpaid} licence(s)</b> en attente de confirmation de paiement`, d: today, go: "nav('finance')" });
  if (OV.newReports) out.push({ lvl: 'red', t: `<b>${OV.newReports} signalement(s)</b> nouveau(x) à traiter`, d: today, go: "nav('reports')" });
  if (OV.errors7d) out.push({ lvl: 'red', t: `<b>${OV.errors7d} erreur(s) serveur</b> remontée(s) sur 7 jours`, d: today, go: "nav('supervision')" });
  if (OV.mailsFailed7d) out.push({ lvl: 'orange', t: `<b>${OV.mailsFailed7d} envoi(s) d'e-mail</b> en échec sur 7 jours`, d: today, go: "nav('mails')" });
  if (OV.devicesBlocked) out.push({ lvl: 'blue', t: `<b>${OV.devicesBlocked} appareil(s)</b> bloqué(s)`, d: today, go: "nav('security')" });
  const b = await api('/api/backups').catch(() => null);
  if (b && b.configured && !b.error) {
    if (b.state === 'OK') out.push({ lvl: 'blue', t: 'Sauvegarde automatique à jour', d: b.lastSuccessAt ? fd(b.lastSuccessAt) : today, go: "nav('backups')" });
    else out.push({ lvl: 'red', t: '<b>Sauvegarde automatique</b> en retard ou en échec', d: today, go: "nav('backups')" });
  }
  return out;
}

/* ---------- graphique réel : activité des installations ---------- */
async function drawChart(days) {
  const box = $('chart'); if (!box) return;
  let rows; try { rows = await api('/api/activity?days=' + days); } catch (e) { box.innerHTML = '<p class="muted">Activité indisponible.</p>'; return; }
  const tot = rows.map((r) => r.licenses + r.mails + r.reports); const max = Math.max(1, ...tot);
  const top = Math.max(4, Math.ceil(max / 4) * 4);
  const W = 560, H = 210, L = 34, R = 10, T = 12, B = 28, n = rows.length;
  const x = (i) => L + (n === 1 ? 0 : (i * (W - L - R)) / (n - 1)), y = (val) => T + (H - T - B) * (1 - val / top);
  const pts = tot.map((t, i) => `${x(i).toFixed(1)},${y(t).toFixed(1)}`);
  const grid = [0, 1, 2, 3, 4].map((k) => { const val = (top * k) / 4; return `<line x1="${L}" x2="${W - R}" y1="${y(val)}" y2="${y(val)}" stroke="#E4E9F0"/><text x="${L - 6}" y="${y(val) + 4}" text-anchor="end" font-size="11" fill="#6B7A8F">${val}</text>`; }).join('');
  const step = Math.ceil(n / 8);
  const lab = rows.map((r, i) => (i % step === 0 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#6B7A8F">${r.day.slice(8)}/${r.day.slice(5, 7)}</text>` : '')).join('');
  const dots = rows.map((r, i) => `<circle cx="${x(i)}" cy="${y(tot[i])}" r="${tot[i] ? 3.5 : 0}" fill="#2F5FA7"><title>${r.day.slice(8)}/${r.day.slice(5, 7)} : ${r.licenses} licence(s) créée(s), ${r.mails} e-mail(s), ${r.reports} signalement(s)</title></circle>`).join('');
  const sum = tot.reduce((a, b) => a + b, 0);
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Activité sur ${days} jours">${grid}${lab}<polygon points="${x(0)},${y(0)} ${pts.join(' ')} ${x(n - 1)},${y(0)}" fill="#2F5FA7" fill-opacity=".12"/><polyline points="${pts.join(' ')}" fill="none" stroke="#2F5FA7" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg>${sum ? '' : '<p class="muted" style="text-align:center;margin:0">Aucune activité enregistrée sur cette période.</p>'}`;
}

function fileToLogo(file) {
  return new Promise((ok, ko) => {
    const r = new FileReader(); r.onerror = () => ko(new Error('Fichier illisible.'));
    r.onload = () => {
      const im = new Image(); im.onerror = () => ko(new Error('Image non reconnue (PNG ou JPEG).'));
      im.onload = () => {
        const k = Math.min(1, 480 / im.width), w = Math.round(im.width * k), h = Math.round(im.height * k);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const cx = cv.getContext('2d'); cx.drawImage(im, 0, 0, w, h);
        let out = cv.toDataURL('image/png');
        if (out.length > 190000) { cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(im, 0, 0, w, h); out = cv.toDataURL('image/jpeg', 0.85); }
        out.length > 190000 ? ko(new Error('Logo trop lourd : choisissez une image plus simple.')) : ok(out);
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

const DURS = [['14d', 'Essai 14 jours'], ['3m', '3 mois'], ['6m', '6 mois'], ['1y', '1 an'], ['perm', 'Permanente'], ['custom', 'Date personnalisée']];
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function addDur(base, k) { const d = new Date(base); if (k === '14d') d.setDate(d.getDate() + 14); else if (k === '3m') d.setMonth(d.getMonth() + 3); else if (k === '6m') d.setMonth(d.getMonth() + 6); else d.setFullYear(d.getFullYear() + 1); return d; }
function durHtml(opts) {

    <div id="dwrap"><label>Expire le</label><input id="ld" type="date" min="${ymd(new Date())}" max="${ymd(new Date(Date.now() + 3650 * 864e5))}" oninput="document.getElementById('dur').value='custom';durChange(true)"></div><div class="yr" id="yr"></div>`;
}
let DBASE = new Date();
function durChange(fromDate) {

  if (k === 'perm') { $('yr').textContent = 'Licence permanente : aucune date d\'expiration.'; return; }
  if (!fromDate && k !== 'custom') $('ld').value = ymd(addDur(DBASE, k));

}

  const f = findLic(id); if (!f) return showHome(); const { c, l } = f;
  DBASE = l.expiresAt && new Date(l.expiresAt) > new Date() ? new Date(l.expiresAt) : new Date();
  v.innerHTML = `<div class="card">${bar('Prolonger la licence')}<p class="muted">${esc(c.name)} · licence n°${l.id} · actuellement : ${l.permanent ? 'permanente' : 'jusqu\'au ' + fd(l.expiresAt)}</p>
    <p class="muted">La durée choisie s'ajoute à ${l.permanent ? 'aujourd\'hui' : (DBASE > new Date() ? 'la date actuelle d\'expiration' : 'aujourd\'hui')}.</p>${durHtml({ def: '1y' })}
    <label>Appareils maximum</label><input id="lm" type="number" min="1" value="${l.maxDevices}"><label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input id="lc" type="checkbox" ${(l.modules || '').includes('COMMERCIAL') ? 'checked' : ''} style="width:auto"> Module Caisse &amp; Ventes</label><label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input id="lp" type="checkbox" ${l.paymentConfirmed ? 'checked' : ''} style="width:auto"> Paiement confirmé (le logo du client s'affiche après confirmation)</label><div class="err" id="err"></div><button onclick="saveExt(${l.id})">Enregistrer</button> <button class="ghost" onclick="back()">Annuler</button></div>`;
  durChange();
}
async function saveExt(id) {
  try { const perm = $('dur').value === 'perm'; await api(`/api/licenses/${id}/extend`, { permanent: perm, expiresAt: $('ld').value, maxDevices: $('lm').value, commercial: $('lc').checked, paid: $('lp').checked }); showClients(); } catch (e) { fail(e); }
}

/* ---------- appareils ---------- */
async function screenDevices(id) {
  const f = findLic(id); if (!f) return showHome();
  try {
    const ds = await api(`/api/licenses/${id}/devices`);
    v.innerHTML = `<div class="card">${bar('Appareils')}<p class="muted">${esc(f.c.name)} · licence n°${id} · ${ds.length} / ${f.l.maxDevices} appareils</p>
      ${ds.map((d) => `<div style="border-top:1px solid var(--line);padding:8px 0"><b>${esc(d.name || 'Appareil sans nom')}</b> ${d.blocked ? '<span class="pill" style="background:var(--danger)">Bloqué</span>' : ''}
        <div class="muted">Dernière connexion : ${d.last_seen_at ? new Date(d.last_seen_at).toLocaleString('fr-FR') : '—'}${d.disconnect_requested ? ' · déconnexion demandée' : ''}</div>
        <button class="ghost" onclick="devAct(${id},'${esc(d.device_id)}','${d.blocked ? 'unblock' : 'block'}')">${d.blocked ? 'Débloquer' : 'Bloquer'}</button> <button class="ghost" onclick="devAct(${id},'${esc(d.device_id)}','disconnect')">Déconnecter</button></div>`).join('')
        || '<p class="muted">Aucun appareil n\'a encore été remonté par l\'installation du client. La liste se remplit automatiquement à chaque contrôle de licence, dès que l\'installation envoie ses appareils.</p>'}
      <button class="ghost" onclick="back()">Retour</button></div>`;
  } catch (e) { fail(e); }
}
async function devAct(id, did, action) {
  if (action === 'block' && !(await confirmBox('Bloquer cet appareil ? Il sera refusé au prochain contrôle de licence.', 'Bloquer'))) return;
  try { await api(`/api/licenses/${id}/devices/action`, { deviceId: did, action }); screenDevices(id); } catch (e) { fail(e); }
}

/* ---------- actions licence / suppression ---------- */
async function licAct(id, action) {
  let reason;
  if (action === 'suspend' || action === 'revoke') { reason = prompt(action === 'revoke' ? 'Révocation DÉFINITIVE. Motif :' : 'Motif de la suspension :'); if (!reason) return; }
  else if (action === 'newcode' && !(await confirmBox('Un nouveau code annule l\'ancien et l\'installation devra être réactivée. Continuer ?', 'Continuer'))) return;
  try { const r = await api(`/api/licenses/${id}/action`, { action, reason }); if (r.code) { CL = await api('/api/clients'); codeModal(r.code); } else showClients(); } catch (e) { alert(e.message); }
}
async function delLic(id, name) {
  if (!(await confirmBox(`Supprimer définitivement la licence n°${id} de « ${name} » ?`))) return;
  try { await api(`/api/licenses/${id}/delete`, {}); showClients(); } catch (e) { alert(e.message); }
}
async function delClient(id) {
  const c = CL.find((x) => x.id == id); if (!c) return;
  if (!(await confirmBox(`Supprimer définitivement le client « ${c.name} » ? Ses ${c.licenses.length} licence(s) seront supprimées et ses appareils libérés.`))) return;
  try { await api(`/api/clients/${id}/delete`, {}); showClients(); } catch (e) { alert(e.message); }
}

/* ---------- mot de passe, journal, réinitialisation ---------- */
function screenPassword() {
  v.innerHTML = `<div class="card">${bar('Changer mon mot de passe')}<label>Mot de passe actuel</label><input id="c1" type="password" autocomplete="current-password"><label>Nouveau (12 caractères minimum)</label><input id="c2" type="password" autocomplete="new-password">
    <div class="err" id="err"></div><button onclick="doPw()">Modifier</button> <button class="ghost" onclick="back()">Retour</button></div>`;
}
async function doPw() { try { await api('/api/password', { current: c1.value, next: c2.value }); $('err').style.color = 'var(--ok)'; $('err').textContent = 'Mot de passe modifié.'; c1.value = c2.value = ''; } catch (e) { fail(e); } }
let RP_ROWS = null, ML_ROWS = null;
let RP_F = { status: '', client: '', from: '', to: '' };
function dlCsv(name, head, rows) {
  const q = (x) => '"' + String(x == null ? '' : x).replace(/"/g, '""').replace(/[\r\n]+/g, ' ') + '"';
  const csv = '\ufeff' + [head, ...rows].map((r) => r.map(q).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = name + '-' + new Date().toISOString().slice(0, 10) + '.csv'; document.body.appendChild(a); a.click(); a.remove();
}
const dateBar = (n, F, fn) => `<input type="date" value="${F.from}" onchange="${n}.from=this.value;${fn}()" title="Du" style="width:auto"> <input type="date" value="${F.to}" onchange="${n}.to=this.value;${fn}()" title="Au" style="width:auto">`;
async function screenReports() {
  try {
    const qs = new URLSearchParams(); if (RP_F.status) qs.set('status', RP_F.status); if (RP_F.client) qs.set('client', RP_F.client); if (RP_F.from) qs.set('from', RP_F.from); if (RP_F.to) qs.set('to', RP_F.to);
    const [rows, cls] = [await api('/api/reports?' + qs), CL.length ? CL : await api('/api/clients')];
    RP_ROWS = rows;
    const lab = { NEW: 'Nouveau', IN_PROGRESS: 'En cours', SOLVED: 'Résolu' };
    v.innerHTML = `<div class="card">${bar('Signalements')}<p class="muted">Problèmes signalés par les utilisateurs et erreurs serveur, avec le contexte envoyé automatiquement. Le contenu privé des clients n'est jamais transmis.</p>
      <select onchange="RP_F.status=this.value;screenReports()"><option value="">Tous les statuts</option>${Object.keys(lab).map((k) => `<option value="${k}" ${RP_F.status === k ? 'selected' : ''}>${lab[k]}</option>`).join('')}</select>
      <select onchange="RP_F.client=this.value;screenReports()"><option value="">Tous les clients</option>${cls.map((c) => `<option value="${c.id}" ${String(RP_F.client) === String(c.id) ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
      ${dateBar('RP_F', RP_F, 'screenReports')} <button class="ghost" onclick="RP_ROWS&&dlCsv('signalements', ['Date','Client','Utilisateur','Rôle','Écran','Message','Statut'], RP_ROWS.map((r) => [new Date(r.reported_at).toLocaleString('fr-FR'), r.client_name, r.user_name, r.role, r.screen, r.message, r.status]))">Exporter (CSV)</button>
      ${rows.length ? `<table>${rows.map((r) => `<tr><td>${esc(new Date(r.reported_at).toLocaleString('fr-FR'))}<br><b>${esc(r.client_name)}</b></td><td><b>${esc(r.user_name || '—')}</b> <span class="muted">${esc(r.role || '')}</span><br><span class="tag" style="display:inline-block;margin:3px 0;padding:2px 8px;border-radius:99px;background:${r.type === 'Mot de passe' ? '#FDECEC' : r.type === 'Panne de téléphone' ? '#FFF3E0' : '#E8EEF9'};font-weight:700;font-size:12px">${esc(r.type || '')}</span><br>${esc(r.screen || '')}</td><td>${esc(r.message || '—')}<br><div style="margin-top:6px;padding:6px 8px;background:#F1F5FB;border-radius:8px;font-size:13px"><b>Diagnostic : ${esc(r.diagnosis.category)}</b> — ${esc(r.diagnosis.cause)}<br><span class="muted">À faire : ${esc(r.diagnosis.action)}</span></div><br><span class="muted">${esc(r.context || '')}</span></td>
        <td><select onchange="setReport(${r.id}, this.value)">${Object.keys(lab).map((k) => `<option value="${k}" ${r.status === k ? 'selected' : ''}>${lab[k]}</option>`).join('')}</select></td></tr>`).join('')}</table>` : '<p class="muted">Aucun signalement.</p>'}</div>`;
  } catch (e) { fail(e); }
}
let GL_F = { from: '', to: '', folder: '' }, GL_ROWS = null;
async function screenGlobal() {
  try {
    const qs = new URLSearchParams(); ['from', 'to', 'folder'].forEach((k) => GL_F[k] && qs.set(k, GL_F[k]));
    const rows = await api('/api/global?' + qs); GL_ROWS = rows;
    const folders = [...new Set((CL.length ? CL : await api('/api/clients')).map((c) => c.folder).filter(Boolean))].sort();
    const sum = (k) => rows.reduce((t, r) => t + r[k], 0);
    const kp = [['Clients', rows.length], ['Appareils', sum('devices')], ['Signalements', sum('reports')], ['Erreurs serveur', sum('errors')], ['E-mails envoyés', sum('mails_sent')], ['Envois en échec', sum('mails_failed')]];
    v.innerHTML = `<div class="card">${bar('Rapports globaux')}<p class="muted">Vue consolidée de tous les clients, remontée automatiquement par les installations. Les dates filtrent signalements, erreurs et e-mails.</p>
      <select onchange="GL_F.folder=this.value;screenGlobal()"><option value="">Tous les dossiers</option>${folders.map((f) => `<option ${GL_F.folder === f ? 'selected' : ''}>${esc(f)}</option>`).join('')}</select>
      ${dateBar('GL_F', GL_F, 'screenGlobal')} <button class="ghost" onclick="GL_ROWS&&dlCsv('rapports-globaux', ['Client','Dossier','Sous-dossier','Pays','Licences','Appareils','Appareils bloqués','Signalements','Erreurs','Signalements ouverts','E-mails envoyés','E-mails en échec','Dernier contact','Version'], GL_ROWS.map((r) => [r.name, r.folder, r.subfolder, r.country, r.licenses, r.devices, r.devices_blocked, r.reports, r.errors, r.reports_open, r.mails_sent, r.mails_failed, r.last_contact ? new Date(r.last_contact).toLocaleString('fr-FR') : '', r.app_version]))">Exporter (CSV)</button>
      <div class="grid">${kp.map((k) => `<div class="kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join('')}</div>
      <div style="overflow:auto"><table><tr><th>Client</th><th>App.</th><th>Signal.</th><th>Erreurs</th><th>E-mails</th><th>Dernier contact</th></tr>${rows.map((r) => `<tr><td><b>${esc(r.name)}</b><br><span class="muted">${esc([r.folder, r.subfolder].filter(Boolean).join(' / '))}</span></td><td>${r.devices}${r.devices_blocked ? ` <span class="muted">(${r.devices_blocked} bloqué(s))</span>` : ''}</td><td>${r.reports}${r.reports_open ? ` <b style="color:var(--danger,#C0504D)">(${r.reports_open} ouvert(s))</b>` : ''}</td><td>${r.errors}</td><td>${r.mails_sent}${r.mails_failed ? ` <b style="color:var(--danger,#C0504D)">/ ${r.mails_failed} échec(s)</b>` : ''}</td><td>${r.last_contact ? esc(new Date(r.last_contact).toLocaleString('fr-FR')) : '—'}${r.app_version ? '<br><span class="muted">v' + esc(r.app_version) + '</span>' : ''}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Aucun client.</td></tr>'}</table></div></div>`;
  } catch (e) { fail(e); }
}
async function screenBackups() {
  try {
    const b = await api('/api/backups');
    const badge = { OK: ['Sauvegarde à jour', 'var(--ok)'], STALE: ['Sauvegarde en retard : à corriger', 'var(--danger,#C0504D)'], UNKNOWN: ['Aucune exécution trouvée', '#C9A24D'] };
    const how = `<p class="muted">Sauvegarde automatique : chaque nuit, une copie chiffrée de la base de l'application est conservée 30 jours dans un dépôt privé GitHub, puis testée par une restauration de contrôle. <b>La restauration reste volontairement manuelle</b> : elle remplace des données de production, elle se fait avec la clé privée de restauration, en présence de l'administrateur.</p>`;
    if (!b.configured) { v.innerHTML = `<div class="card">${bar('Sauvegardes')}${how}<p>Le suivi automatique n'est pas encore activé. Dans Render (service Master), ajoutez <code>BACKUP_REPO</code> (nom du dépôt de sauvegardes) et <code>BACKUP_GH_TOKEN</code> (jeton GitHub en lecture seule limité à ce dépôt). Vous verrez ici l'état de chaque sauvegarde, avec une alerte si elle échoue.</p></div>`; return; }
    if (b.error) { v.innerHTML = `<div class="card">${bar('Sauvegardes')}${how}<p style="color:var(--danger,#C0504D)">${esc(b.error)}</p></div>`; return; }
    const bd = badge[b.state] || badge.UNKNOWN;
    v.innerHTML = `<div class="card">${bar('Sauvegardes')}${how}<p><b style="color:${bd[1]}">${bd[0]}</b>${b.lastSuccessAt ? ' — dernière réussite : ' + esc(new Date(b.lastSuccessAt).toLocaleString('fr-FR')) + ' (il y a ' + b.hoursSinceSuccess + ' h)' : ''}</p>
      <table>${b.runs.map((r) => `<tr><td>${esc(new Date(r.at).toLocaleString('fr-FR'))}</td><td><b style="color:${r.conclusion === 'success' ? 'var(--ok)' : r.conclusion ? 'var(--danger,#C0504D)' : '#C9A24D'}">${r.conclusion === 'success' ? 'Réussie' : r.conclusion ? 'Échec' : 'En cours'}</b></td></tr>`).join('')}</table></div>`;
  } catch (e) { fail(e); }
}
let ML_F = { status: '', client: '', from: '', to: '' };
const MAIL_HELP = { AUTH: "Le serveur d'e-mail a refusé l'identifiant : renouvelez la clé SMTP dans Render (SMTP_USER / SMTP_PASS).", TIMEOUT: "Le serveur d'e-mail ne répond pas : sur l'offre gratuite de Render les ports SMTP sont bloqués (passer à l'offre payante).", CONNECTION: "Connexion impossible : vérifiez SMTP_HOST et SMTP_PORT.", SENDER_REFUSED: "Adresse refusée : l'expéditeur MAIL_FROM doit être validé chez Brevo, ou l'adresse du destinataire est invalide.", CONFIG: "E-mail non configuré chez ce client (variables SMTP manquantes).", UNKNOWN: "Échec d'envoi : cause non identifiée." };
async function screenMails() {
  try {
    const qs = new URLSearchParams(); if (ML_F.status) qs.set('status', ML_F.status); if (ML_F.client) qs.set('client', ML_F.client); if (ML_F.from) qs.set('from', ML_F.from); if (ML_F.to) qs.set('to', ML_F.to);
    const [rows, cls] = [await api('/api/mails?' + qs), CL.length ? CL : await api('/api/clients')];
    ML_ROWS = rows;
    const lab = { SENT: 'Envoyé', FAILED: 'Échec', SIMULATED: 'Non envoyé (non configuré)' };
    v.innerHTML = `<div class="card">${bar("Envois d'e-mails")}<p class="muted">Qui a envoyé, quand, vers quelle adresse (masquée), avec le statut et la raison en clair en cas d'échec. Remonté automatiquement chaque heure par les applications clientes. Aucun contenu de rapport n'est transmis.</p>
      <select onchange="ML_F.status=this.value;screenMails()"><option value="">Tous les statuts</option>${Object.keys(lab).map((k) => `<option value="${k}" ${ML_F.status === k ? 'selected' : ''}>${lab[k]}</option>`).join('')}</select>
      <select onchange="ML_F.client=this.value;screenMails()"><option value="">Tous les clients</option>${cls.map((c) => `<option value="${c.id}" ${String(ML_F.client) === String(c.id) ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
      ${dateBar('ML_F', ML_F, 'screenMails')} <button class="ghost" onclick="ML_ROWS&&dlCsv('envois', ['Date','Client','Objet','Destinataire','Statut','Raison'], ML_ROWS.map((r) => [new Date(r.at).toLocaleString('fr-FR'), r.client_name, r.subject, r.recipient, r.status, r.error || r.message]))">Exporter (CSV)</button>
      ${rows.length ? `<table>${rows.map((r) => `<tr><td>${esc(new Date(r.at).toLocaleString('fr-FR'))}<br><b>${esc(r.client_name)}</b></td><td>${esc(r.subject || '—')}<br><span class="muted">${esc(r.recipient || '')}</span></td><td><b style="color:${r.status === 'SENT' ? 'var(--ok)' : 'var(--danger,#C0504D)'}">${lab[r.status] || esc(r.status)}</b>${r.status !== 'SENT' ? `<br><span class="muted">${esc(MAIL_HELP[r.error] || r.message || '')}</span>` : ''}</td></tr>`).join('')}</table>` : '<p class="muted">Aucun envoi enregistré pour le moment.</p>'}</div>`;
  } catch (e) { fail(e); }
}
async function setReport(id, status) { try { await api('/api/reports/status', { id, status }); } catch (e) { fail(e); } }
async function screenAudit() {
  try { const log = await api('/api/audit');
    v.innerHTML = `<div class="card">${bar('Journal d\'audit')}<p class="muted">Les 50 dernières actions. Le journal n'est jamais effacé.</p><table>${log.map((l) => `<tr><td>${esc(new Date(l.at).toLocaleString('fr-FR'))}</td><td>${esc(l.action)}</td><td>${esc(l.detail || '')}</td></tr>`).join('')}</table></div>`;
  } catch (e) { fail(e); }
}
function screenReset() {
  v.innerHTML = `<div class="card">${bar('Tout réinitialiser (mode test)')}<p><b>Attention :</b> tous les clients, toutes les licences et tous les appareils seront supprimés définitivement. Le journal d'audit est conservé.</p>
    <label>Tapez le mot SUPPRIMER</label><input id="rw" autocomplete="off"><label>Code à 6 chiffres de votre application d'authentification</label><input id="rc" inputmode="numeric" placeholder="123456" autocomplete="one-time-code">
    <div class="err" id="err"></div><button class="danger" onclick="doReset()">Tout supprimer</button> <button class="ghost" onclick="back()">Annuler</button></div>`;
}
async function doReset() { try { const r = await api('/api/reset', { word: rw.value, code: rc.value }); alert(`Terminé : ${r.clients} client(s) et ${r.licenses} licence(s) supprimés.`); history.replaceState({ r: 'home' }, ''); showHome(); } catch (e) { fail(e); } }
async function logout() { try { await api('/api/logout', {}); } catch (e) {} showLogin(); }

/* ---------- démarrage : message d'attente pendant le réveil du serveur (offre gratuite Render) ---------- */
async function boot() {
  paintIcons();
  history.replaceState({ r: 'home' }, '');
  const t0 = Date.now();
  v.innerHTML = `<div class="card" style="text-align:center"><div class="spin"></div><h2>Réveil du serveur…</h2><p class="muted" id="wk">Sur l'offre gratuite, le premier chargement peut prendre jusqu'à 50 secondes. Merci de patienter.</p></div>`;
  const tick = setInterval(() => { const e = $('wk'); if (e) e.textContent = `Sur l'offre gratuite, le premier chargement peut prendre jusqu'à 50 secondes. Merci de patienter… ${Math.round((Date.now() - t0) / 1000)} s`; }, 1000);
  for (let i = 0; i < 40; i++) { try { const r = await fetch('/health', { cache: 'no-store' }); if (r.ok) break; } catch (e) {} await new Promise((r) => setTimeout(r, 3000)); }
  clearInterval(tick);
  api('/api/me').then(() => { LOGGED = true; showHome(); }).catch(() => showLogin());
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
boot();
</script>
