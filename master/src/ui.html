<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E2740">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>SYLLOGISTIQUE MASTER</title>
<style>
  :root{--navy:#163A5F;--navy-dark:#0E2740;--gold:#E0A72E;--bg:#F5F7FA;--text:#16233A;--muted:#6B7A8F;--line:#E4E9F0;--danger:#C0392B;--ok:#1E7B4B}
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{background:var(--navy-dark);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  header b{letter-spacing:.5px} header small{color:var(--gold);display:block;font-size:11px}
  main{max-width:560px;margin:0 auto;padding:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  h2{margin:0 0 10px;font-size:17px;color:var(--navy)} label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:15px}
  button,a.btn{display:inline-block;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:11px 16px;font-size:15px;margin-top:12px;cursor:pointer;text-decoration:none}
  button.gold{background:var(--gold);color:#1b1b1b} button.ghost{background:none;color:var(--navy);border:1px solid var(--line)}
  .err{color:var(--danger);font-size:13px;margin-top:8px;min-height:18px} .muted{color:var(--muted);font-size:13px}
  code{background:#EEF2F7;padding:3px 6px;border-radius:5px;word-break:break-all;font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px} .kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .kpi b{font-size:22px;color:var(--navy);display:block} .kpi span{font-size:11px;color:var(--muted)}
  .codes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0} .codes code{text-align:center}
  table{width:100%;border-collapse:collapse;font-size:12px} td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:6px} .bar h2{margin:0;flex:1}
  button.back{margin:0;padding:6px 14px;font-size:22px;line-height:1;background:none;color:var(--navy);border:1px solid var(--line)}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff;vertical-align:middle}
  .alert{background:#FFF6E0;border:1px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
  .yr{font-size:15px;font-weight:700;color:var(--navy);margin:8px 0}
  select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0} .chips button{margin:0;padding:6px 12px;font-size:13px}
  .chips button.on{background:var(--navy);color:#fff}
  button.danger{background:var(--danger);color:#fff}
  #modal{position:fixed;inset:0;background:rgba(14,39,64,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
  #modal .card{max-width:440px;width:100%;margin:0}
  .big{font-size:20px;letter-spacing:1px;text-align:center;display:block;padding:12px 8px;margin:10px 0}
  .spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:10px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header><div><b>SYLLOGISTIQUE</b><small>MASTER · accès privé</small></div><button id="out" class="ghost" style="display:none;margin:0;color:#fff;border-color:#3b5877" onclick="logout()">Déconnexion</button></header>
<main id="v"></main>
<div id="modal"></div>
<script>
const v = document.getElementById('v');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function api(path, body) {
  const r = await fetch(path, { method: body === undefined ? 'GET' : 'POST', headers: { 'content-type': 'application/json', 'x-requested-with': 'master' }, body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || 'Erreur'); e.status = r.status; throw e; }
  return j;
}
const fail = (e) => { if (e.status === 401 && LOGGED) { return expired(); } const x = $('err'); if (x) x.textContent = e.message; else alert(e.message); };
let LOGGED = false, CL = [], FQ = '', FS = 'all';

/* ---------- navigation : flèche ← et bouton Retour du téléphone ---------- */
function nav(r, a) { history.pushState({ r, a }, ''); render({ r, a }); }
function back() { if (history.state && history.state.r && history.state.r !== 'home') history.back(); else showHome(); }
window.addEventListener('popstate', (e) => { closeModal(); if (LOGGED) render(e.state || { r: 'home' }); });
function render(st) {
  window.scrollTo(0, 0);
  const f = { home: showHome, client: screenClient, license: screenLicense, extend: screenExtend, devices: screenDevices, password: screenPassword, audit: screenAudit, reset: screenReset }[st.r] || showHome;
  return f(st.a);
}
const bar = (t) => `<div class="bar"><button class="back" onclick="back()" aria-label="Retour" title="Retour">←</button><h2>${esc(t)}</h2></div>`;

/* ---------- fenêtres ---------- */
function closeModal() { const m = $('modal'); m.style.display = 'none'; m.innerHTML = ''; }
function openModal(html) { const m = $('modal'); m.innerHTML = `<div class="card">${html}</div>`; m.style.display = 'flex'; }
function confirmBox(text, ok = 'Supprimer') {
  return new Promise((res) => {
    openModal(`<h2>Confirmation</h2><p>${esc(text)}</p><button class="ghost" id="cn">Annuler</button> <button class="danger" id="cy">${esc(ok)}</button>`);
    $('cn').onclick = () => { closeModal(); res(false); }; $('cy').onclick = () => { closeModal(); res(true); };
  });
}
function copyText(t, btn) {
  const done = () => { if (btn) btn.textContent = 'Copié ✓'; };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, () => fb()); else fb();
  function fb() { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} ta.remove(); }
}
function codeModal(code) {
  openModal(`<h2>Code d'activation</h2><p class="muted">Voici le code <b>complet</b>. Il ne sera plus jamais affiché : copiez-le maintenant et envoyez-le au client. Il est valable pour une seule installation.</p>
    <code class="big" id="fullcode">${esc(code)}</code>
    <button class="gold" id="cp">Copier</button> <button class="ghost" id="rt">Retour</button>`);
  $('cp').onclick = () => copyText(code, $('cp'));
  $('rt').onclick = () => { closeModal(); showHome(); };
}

/* ---------- déconnexion automatique après 15 minutes d'inactivité ---------- */
let idleT = null;
function bump() { clearTimeout(idleT); if (LOGGED) idleT = setTimeout(expired, 15 * 60000); }
['click', 'keydown', 'touchstart', 'scroll', 'mousemove'].forEach((ev) => window.addEventListener(ev, bump, { passive: true }));
async function expired() { try { await api('/api/logout', {}); } catch (e) {} showLogin('Session fermée après 15 minutes d\'inactivité. Reconnectez-vous.'); }

/* ---------- connexion ---------- */
function showLogin(msg) {
  LOGGED = false; clearTimeout(idleT); closeModal();
  $('out').style.display = 'none';
  v.innerHTML = `<div class="card"><h2>Connexion propriétaire</h2>
    <label>E-mail</label><input id="em" type="email" autocomplete="username">
    <label>Mot de passe</label><input id="pw" type="password" autocomplete="current-password">
    <div class="err" id="err">${esc(msg || '')}</div><button onclick="doLogin()">Se connecter</button></div>`;
}
async function doLogin() {
  try { const r = await api('/api/login', { email: em.value, password: pw.value }); r.next === 'enroll' ? showEnroll() : showCode(); } catch (e) { fail(e); }
}
function showCode() {
  v.innerHTML = `<div class="card"><h2>Code de vérification</h2><p class="muted">Entrez le code à 6 chiffres de votre application d'authentification (ou un code de secours).</p>
    <input id="cd" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"><div class="err" id="err"></div><button onclick="doCode()">Valider</button></div>`;
}
async function doCode() { try { await api('/api/login/code', { code: cd.value }); LOGGED = true; history.replaceState({ r: 'home' }, ''); showHome(); } catch (e) { fail(e); } }
async function showEnroll() {
  try {
    const s = await api('/api/2fa/setup');
    v.innerHTML = `<div class="card"><h2>Activer la double authentification</h2>
      <p class="muted">Obligatoire pour protéger toutes vos licences. Installez une application d'authentification (Google Authenticator, Microsoft Authenticator…).</p>
      <a class="btn gold" href="${esc(s.uri)}">Ouvrir mon application d'authentification</a>
      <p class="muted" style="margin-top:14px">Si rien ne s'ouvre, ajoutez ce compte manuellement avec cette clé :</p><code>${esc(s.secret)}</code>
      <label>Code à 6 chiffres affiché dans l'application</label><input id="cd" inputmode="numeric" placeholder="123456">
      <div class="err" id="err"></div><button onclick="doConfirm()">Activer</button></div>`;
  } catch (e) { showLogin(); }
}
async function doConfirm() {
  try {
    const r = await api('/api/2fa/confirm', { code: cd.value }); LOGGED = true;
    v.innerHTML = `<div class="card"><h2>Codes de secours</h2><p class="muted"><b>Notez-les maintenant</b> dans un endroit sûr : ils ne seront plus jamais affichés. Chacun sert une seule fois si vous perdez votre téléphone.</p>
      <div class="codes">${r.codes.map((c) => `<code>${esc(c)}</code>`).join('')}</div><button onclick="history.replaceState({r:'home'},'');showHome()">J'ai noté mes codes</button></div>`;
  } catch (e) { fail(e); }
}

/* ---------- accueil ---------- */
const STL = { PENDING: ['En attente', '#B7791F'], ACTIVE: ['Active', 'var(--ok)'], SUSPENDED: ['Suspendue', '#B7791F'], REVOKED: ['Révoquée', 'var(--danger)'], EXPIRED: ['Expirée', 'var(--danger)'] };
const pill = (k) => { const st = STL[k] || [k, '#666']; return `<span class="pill" style="background:${st[1]}">${st[0]}</span>`; };
const fd = (d) => (d ? new Date(d).toLocaleDateString('fr-FR') : '—');
const fdl = (d) => new Date(d).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
// statut global d'un client, d'après ses licences
function clientState(c) {
  const e = c.licenses.map((l) => l.effective);
  if (e.includes('ACTIVE')) return 'ACTIVE'; if (e.includes('PENDING')) return 'PENDING'; if (e.includes('SUSPENDED')) return 'SUSPENDED';
  if (e.includes('EXPIRED')) return 'EXPIRED'; if (e.includes('REVOKED')) return 'REVOKED'; return 'NONE';
}
const FILTERS = [['all', 'Tous'], ['ACTIVE', 'Actifs'], ['PENDING', 'En attente'], ['EXPIRED', 'Expirés'], ['REVOKED', 'Révoqués']];
function expiring() {
  const lim = Date.now() + 30 * 864e5;
  return CL.flatMap((c) => c.licenses.filter((l) => !l.permanent && l.expiresAt && ['ACTIVE', 'PENDING', 'SUSPENDED'].includes(l.effective) && new Date(l.expiresAt).getTime() < lim).map((l) => ({ c, l })));
}
async function showHome() {
  try {
    const me = await api('/api/me'); CL = await api('/api/clients'); LOGGED = true; bump();
    $('out').style.display = 'inline-block';
    const lics = CL.flatMap((c) => c.licenses); const act = lics.filter((l) => l.effective === 'ACTIVE').length;
    const ex = expiring();
    v.innerHTML = `<div class="card"><h2>Bienvenue, Monsieur SYLLA</h2><p class="muted">${esc(me.email)}</p></div>
      ${ex.length ? `<div class="alert"><b>⚠ ${ex.length} licence(s) expirent dans moins de 30 jours</b>${ex.map(({ c, l }) => `<div>${esc(c.name)} · licence n°${l.id} · ${fd(l.expiresAt)} (${Math.max(0, Math.ceil((new Date(l.expiresAt) - Date.now()) / 864e5))} j) <a href="#" onclick="nav('extend',${l.id});return false">Prolonger</a></div>`).join('')}</div>` : ''}
      <div class="grid"><div class="kpi"><b>${CL.length}</b><span>Clients</span></div><div class="kpi"><b>${lics.length}</b><span>Licences</span></div><div class="kpi"><b>${act}</b><span>Actives</span></div></div>
      <div class="card" style="margin-top:14px"><h2>Clients</h2>
        <input id="q" placeholder="Rechercher un client…" value="${esc(FQ)}" oninput="FQ=this.value;drawList()">
        <div class="chips" id="chips"></div>
        <div id="cl"></div>
        <button class="gold" onclick="nav('client',null)">+ Nouveau client</button>
        <div style="margin-top:6px"><a class="btn ghost" href="/api/export/clients.csv">Exporter les clients (CSV)</a> <a class="btn ghost" href="/api/export/licenses.csv">Exporter les licences (CSV)</a></div></div>
      <div class="card"><h2>Mon compte</h2><button class="ghost" onclick="nav('password')">Changer mon mot de passe</button> <button class="ghost" onclick="nav('audit')">Journal d'audit</button></div>
      <div class="card" style="border-color:var(--danger)"><h2>Mode test</h2><p class="muted">Supprime tous les clients et toutes les licences de test. Le journal d'audit est conservé.</p><button class="ghost" style="color:var(--danger)" onclick="nav('reset')">Tout réinitialiser (mode test)</button></div>`;
    drawList();
  } catch (e) { showLogin(); }
}
function drawList() {
  $('chips').innerHTML = FILTERS.map(([k, t]) => `<button class="ghost ${FS === k ? 'on' : ''}" onclick="FS='${k}';drawList()">${t}</button>`).join('');
  const q = FQ.trim().toLowerCase();
  const list = CL.filter((c) => (FS === 'all' || clientState(c) === FS) && (!q || [c.name, c.contact_name, c.email, c.phone, c.country].join(' ').toLowerCase().includes(q)));
  $('cl').innerHTML = list.map(clientCard).join('') || `<p class="muted">${CL.length ? 'Aucun client ne correspond.' : 'Aucun client pour le moment.'}</p>`;
}
function clientCard(c) {
  const st = clientState(c);
  return `<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px"><b>${esc(c.name)}</b> ${st === 'NONE' ? '<span class="pill" style="background:#8895A7">Sans licence</span>' : pill(st)} <span class="muted">${esc(c.country || '')}</span>
    <div class="muted">${esc([c.contact_name, c.phone, c.email].filter(Boolean).join(' · '))}</div>
    ${c.licenses.map((l) => `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">
      ${pill(l.effective)} <span class="muted">· licence n°${l.id} · code …${esc(l.hint)} · ${l.permanent ? 'permanente' : 'jusqu\'au ' + fd(l.expiresAt)} · ${l.maxDevices} appareils max</span>
      ${l.reason ? `<div class="muted">Motif : ${esc(l.reason)}</div>` : ''}${l.lastCheckAt ? `<div class="muted">Dernier contact : ${new Date(l.lastCheckAt).toLocaleString('fr-FR')}${l.appVersion ? ' · v' + esc(l.appVersion) : ''}</div>` : ''}
      <div>${l.status === 'REVOKED' ? '' : `${l.status === 'SUSPENDED' ? `<button class="ghost" onclick="licAct(${l.id},'reactivate')">Rétablir</button>` : `<button class="ghost" onclick="licAct(${l.id},'suspend')">Suspendre</button>`}
        <button class="ghost" onclick="nav('extend',${l.id})">Prolonger</button> <button class="ghost" onclick="licAct(${l.id},'newcode')">Nouveau code</button> <button class="ghost" style="color:var(--danger)" onclick="licAct(${l.id},'revoke')">Révoquer</button>`}
        <button class="ghost" onclick="nav('devices',${l.id})">Appareils</button>
        ${['REVOKED', 'EXPIRED'].includes(l.effective) ? `<button class="danger" onclick="delLic(${l.id},'${esc(c.name).replace(/'/g, '')}')">Supprimer</button>` : ''}</div></div>`).join('')}
    <button class="ghost" onclick="nav('license',${c.id})">+ Licence</button> <button class="ghost" onclick="nav('client',${c.id})">Modifier le client</button> <button class="danger" onclick="delClient(${c.id})">Supprimer</button></div>`;
}

/* ---------- client : création / modification ---------- */
function screenClient(id) {
  const c = id ? CL.find((x) => x.id == id) : null; if (id && !c) return showHome();
  v.innerHTML = `<div class="card">${bar(c ? 'Modifier le client' : 'Nouveau client')}
    <label>Nom du client *</label><input id="n1" value="${esc(c && c.name)}"><label>Contact</label><input id="n2" value="${esc(c && c.contact_name)}"><label>Téléphone</label><input id="n3" value="${esc(c && c.phone)}"><label>E-mail</label><input id="n4" value="${esc(c && c.email)}"><label>Pays</label><input id="n5" value="${esc(c && c.country)}">
    <label>Couleur (ex. #1E7B4B)</label><input id="n6" placeholder="#163A5F" value="${esc(c && c.brand_color)}"><div class="err" id="err"></div><button onclick="saveClient(${c ? c.id : 'null'})">Enregistrer</button> <button class="ghost" onclick="back()">Annuler</button></div>`;
}
async function saveClient(id) { try { await api(id ? '/api/clients/' + id : '/api/clients', { name: n1.value, contactName: n2.value, phone: n3.value, email: n4.value, country: n5.value, brandColor: n6.value }); showHome(); } catch (e) { fail(e); } }

/* ---------- durée de licence (menu + date avec année bien visible) ---------- */
const DURS = [['14d', 'Essai 14 jours'], ['3m', '3 mois'], ['6m', '6 mois'], ['1y', '1 an'], ['perm', 'Permanente'], ['custom', 'Date personnalisée']];
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function addDur(base, k) { const d = new Date(base); if (k === '14d') d.setDate(d.getDate() + 14); else if (k === '3m') d.setMonth(d.getMonth() + 3); else if (k === '6m') d.setMonth(d.getMonth() + 6); else d.setFullYear(d.getFullYear() + 1); return d; }
function durHtml(opts) {
  return `<label>Durée</label><select id="dur" onchange="durChange()">${DURS.filter((d) => opts.perm !== false || d[0] !== 'perm').map(([k, t]) => `<option value="${k}" ${k === opts.def ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <div id="dwrap"><label>Expire le</label><input id="ld" type="date" min="${ymd(new Date())}" max="${ymd(new Date(Date.now() + 3650 * 864e5))}" oninput="document.getElementById('dur').value='custom';durChange(true)"></div><div class="yr" id="yr"></div>`;
}
let DBASE = new Date();
function durChange(fromDate) {
  const k = $('dur').value;
  $('dwrap').style.display = k === 'perm' ? 'none' : 'block';
  if (k === 'perm') { $('yr').textContent = 'Licence permanente : aucune date d\'expiration.'; return; }
  if (!fromDate && k !== 'custom') $('ld').value = ymd(addDur(DBASE, k));
  $('yr').textContent = $('ld').value ? 'Expire le ' + fdl($('ld').value + 'T12:00:00') : 'Choisissez une date.';
}

/* ---------- licence : création ---------- */
function screenLicense(cid) {
  const c = CL.find((x) => x.id == cid); if (!c) return showHome();
  DBASE = new Date();
  v.innerHTML = `<div class="card">${bar('Nouvelle licence')}<p class="muted">Client : <b>${esc(c.name)}</b></p>${durHtml({ def: '1y' })}
    <label>Appareils maximum</label><input id="lm" type="number" min="1" value="50"><div class="err" id="err"></div><button onclick="saveLic(${cid})">Créer la licence</button> <button class="ghost" onclick="back()">Annuler</button></div>`;
  durChange();
}
async function saveLic(id) {
  try { const perm = $('dur').value === 'perm'; const r = await api(`/api/clients/${id}/licenses`, { permanent: perm, expiresAt: $('ld').value, maxDevices: $('lm').value }); CL = await api('/api/clients'); codeModal(r.code); history.replaceState({ r: 'home' }, ''); } catch (e) { fail(e); }
}

/* ---------- prolonger ---------- */
function findLic(id) { for (const c of CL) for (const l of c.licenses) if (l.id == id) return { c, l }; return null; }
function screenExtend(id) {
  const f = findLic(id); if (!f) return showHome(); const { c, l } = f;
  DBASE = l.expiresAt && new Date(l.expiresAt) > new Date() ? new Date(l.expiresAt) : new Date();
  v.innerHTML = `<div class="card">${bar('Prolonger la licence')}<p class="muted">${esc(c.name)} · licence n°${l.id} · actuellement : ${l.permanent ? 'permanente' : 'jusqu\'au ' + fd(l.expiresAt)}</p>
    <p class="muted">La durée choisie s'ajoute à ${l.permanent ? 'aujourd\'hui' : (DBASE > new Date() ? 'la date actuelle d\'expiration' : 'aujourd\'hui')}.</p>${durHtml({ def: '1y' })}
    <label>Appareils maximum</label><input id="lm" type="number" min="1" value="${l.maxDevices}"><div class="err" id="err"></div><button onclick="saveExt(${l.id})">Enregistrer</button> <button class="ghost" onclick="back()">Annuler</button></div>`;
  durChange();
}
async function saveExt(id) {
  try { const perm = $('dur').value === 'perm'; await api(`/api/licenses/${id}/extend`, { permanent: perm, expiresAt: $('ld').value, maxDevices: $('lm').value }); showHome(); } catch (e) { fail(e); }
}

/* ---------- appareils ---------- */
async function screenDevices(id) {
  const f = findLic(id); if (!f) return showHome();
  try {
    const ds = await api(`/api/licenses/${id}/devices`);
    v.innerHTML = `<div class="card">${bar('Appareils')}<p class="muted">${esc(f.c.name)} · licence n°${id} · ${ds.length} / ${f.l.maxDevices} appareils</p>
      ${ds.map((d) => `<div style="border-top:1px solid var(--line);padding:8px 0"><b>${esc(d.name || 'Appareil sans nom')}</b> ${d.blocked ? '<span class="pill" style="background:var(--danger)">Bloqué</span>' : ''}
        <div class="muted">Dernière connexion : ${d.last_seen_at ? new Date(d.last_seen_at).toLocaleString('fr-FR') : '—'}${d.disconnect_requested ? ' · déconnexion demandée' : ''}</div>
        <button class="ghost" onclick="devAct(${id},'${esc(d.device_id)}','${d.blocked ? 'unblock' : 'block'}')">${d.blocked ? 'Débloquer' : 'Bloquer'}</button> <button class="ghost" onclick="devAct(${id},'${esc(d.device_id)}','disconnect')">Déconnecter</button></div>`).join('')
        || '<p class="muted">Aucun appareil n\'a encore été remonté par l\'installation du client. La liste se remplit automatiquement à chaque contrôle de licence, dès que l\'installation envoie ses appareils.</p>'}
      <button class="ghost" onclick="back()">Retour</button></div>`;
  } catch (e) { fail(e); }
}
async function devAct(id, did, action) {
  if (action === 'block' && !(await confirmBox('Bloquer cet appareil ? Il sera refusé au prochain contrôle de licence.', 'Bloquer'))) return;
  try { await api(`/api/licenses/${id}/devices/action`, { deviceId: did, action }); screenDevices(id); } catch (e) { fail(e); }
}

/* ---------- actions licence / suppression ---------- */
async function licAct(id, action) {
  let reason;
  if (action === 'suspend' || action === 'revoke') { reason = prompt(action === 'revoke' ? 'Révocation DÉFINITIVE. Motif :' : 'Motif de la suspension :'); if (!reason) return; }
  else if (action === 'newcode' && !(await confirmBox('Un nouveau code annule l\'ancien et l\'installation devra être réactivée. Continuer ?', 'Continuer'))) return;
  try { const r = await api(`/api/licenses/${id}/action`, { action, reason }); if (r.code) { CL = await api('/api/clients'); codeModal(r.code); } else showHome(); } catch (e) { alert(e.message); }
}
async function delLic(id, name) {
  if (!(await confirmBox(`Supprimer définitivement la licence n°${id} de « ${name} » ?`))) return;
  try { await api(`/api/licenses/${id}/delete`, {}); showHome(); } catch (e) { alert(e.message); }
}
async function delClient(id) {
  const c = CL.find((x) => x.id == id); if (!c) return;
  if (!(await confirmBox(`Supprimer définitivement le client « ${c.name} » ? Ses ${c.licenses.length} licence(s) seront supprimées et ses appareils libérés.`))) return;
  try { await api(`/api/clients/${id}/delete`, {}); showHome(); } catch (e) { alert(e.message); }
}

/* ---------- mot de passe, journal, réinitialisation ---------- */
function screenPassword() {
  v.innerHTML = `<div class="card">${bar('Changer mon mot de passe')}<label>Mot de passe actuel</label><input id="c1" type="password" autocomplete="current-password"><label>Nouveau (12 caractères minimum)</label><input id="c2" type="password" autocomplete="new-password">
    <div class="err" id="err"></div><button onclick="doPw()">Modifier</button> <button class="ghost" onclick="back()">Retour</button></div>`;
}
async function doPw() { try { await api('/api/password', { current: c1.value, next: c2.value }); $('err').style.color = 'var(--ok)'; $('err').textContent = 'Mot de passe modifié.'; c1.value = c2.value = ''; } catch (e) { fail(e); } }
async function screenAudit() {
  try { const log = await api('/api/audit');
    v.innerHTML = `<div class="card">${bar('Journal d\'audit')}<p class="muted">Les 50 dernières actions. Le journal n'est jamais effacé.</p><table>${log.map((l) => `<tr><td>${esc(new Date(l.at).toLocaleString('fr-FR'))}</td><td>${esc(l.action)}</td><td>${esc(l.detail || '')}</td></tr>`).join('')}</table></div>`;
  } catch (e) { fail(e); }
}
function screenReset() {
  v.innerHTML = `<div class="card">${bar('Tout réinitialiser (mode test)')}<p><b>Attention :</b> tous les clients, toutes les licences et tous les appareils seront supprimés définitivement. Le journal d'audit est conservé.</p>
    <label>Tapez le mot SUPPRIMER</label><input id="rw" autocomplete="off"><label>Code à 6 chiffres de votre application d'authentification</label><input id="rc" inputmode="numeric" placeholder="123456" autocomplete="one-time-code">
    <div class="err" id="err"></div><button class="danger" onclick="doReset()">Tout supprimer</button> <button class="ghost" onclick="back()">Annuler</button></div>`;
}
async function doReset() { try { const r = await api('/api/reset', { word: rw.value, code: rc.value }); alert(`Terminé : ${r.clients} client(s) et ${r.licenses} licence(s) supprimés.`); history.replaceState({ r: 'home' }, ''); showHome(); } catch (e) { fail(e); } }
async function logout() { try { await api('/api/logout', {}); } catch (e) {} showLogin(); }

/* ---------- démarrage : message d'attente pendant le réveil du serveur (offre gratuite Render) ---------- */
async function boot() {
  history.replaceState({ r: 'home' }, '');
  const t0 = Date.now();
  v.innerHTML = `<div class="card" style="text-align:center"><div class="spin"></div><h2>Réveil du serveur…</h2><p class="muted" id="wk">Sur l'offre gratuite, le premier chargement peut prendre jusqu'à 50 secondes. Merci de patienter.</p></div>`;
  const tick = setInterval(() => { const e = $('wk'); if (e) e.textContent = `Sur l'offre gratuite, le premier chargement peut prendre jusqu'à 50 secondes. Merci de patienter… ${Math.round((Date.now() - t0) / 1000)} s`; }, 1000);
  for (let i = 0; i < 40; i++) { try { const r = await fetch('/health', { cache: 'no-store' }); if (r.ok) break; } catch (e) {} await new Promise((r) => setTimeout(r, 3000)); }
  clearInterval(tick);
  api('/api/me').then(() => { LOGGED = true; showHome(); }).catch(() => showLogin());
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
boot();
</script>
</body>
</html>
