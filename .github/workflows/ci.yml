name: CI
on:
  push:
    branches: [main, v9-fondations]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
      - run: npm run build
      - run: node scripts/check-ui.js
      - run: npm run build:ui
      - name: Requêtes SQL directes toutes relues (cloisonnement)
        run: node scripts/check-raw-sql.js
      - run: test -s public/core.js
  master:
    name: master (tests avec vraie base PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    defaults:
      run:
        working-directory: master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
  smoke:
    name: smoke (backend démarré sur vraie base PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      JWT_ACCESS_SECRET: ci-secret-de-test-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-de-test-0123456789abcdef0123456789abcdef
      NODE_ENV: test
      PORT: '3000'
      # Valeur de test uniquement (la vraie clé est une variable secrète du serveur de production)
      PLATFORM_ADMIN_KEY: ci-cle-plateforme-de-test-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate --accept-data-loss
      - run: npm run build
      - run: npx ts-node prisma/seed.ts
      - name: Situation de la production (11 rôles sur 15 en base)
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "DELETE FROM roles r WHERE r.name IN ('MECANICIEN','POINTEUR','COMPTABLE','RESPONSABLE_OPERATIONS') AND NOT EXISTS (SELECT 1 FROM users u WHERE u.role_id = r.id)"
          psql postgresql://postgres:postgres@localhost:5432/postgres -Atc "SELECT count(*) FROM roles"
      - name: Démarrage du serveur
        run: |
          node dist/main.js > server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:3000/health && break; sleep 2; done
      - run: node scripts/functional.js
      - run: sleep 61
      - run: node scripts/functional2.js
      - run: sleep 61
      - run: node scripts/functional3.js
      - run: sleep 61
      - name: Circuits complets (droits, DG, panne, chauffeur)
        run: node scripts/functional4.js
      - run: sleep 61
      - name: Sécurité et circuits restants (sites, sessions, invitations, caisse)
        run: node scripts/functional5.js
      - run: sleep 61
      - name: Test d'interface par clics (Chrome sans écran)
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          node scripts/ui-click.js
      - run: sleep 61
      - name: Test d'interface par rôles et création d'un client
        run: node scripts/ui-roles.js
      - run: sleep 61
      - name: Test d'interface livraison et rôles terrain
        run: node scripts/ui-livraison.js
      - run: sleep 61
      - run: sleep 61
      - name: Tests multi-entreprises et multi-sites
        run: node scripts/functional6.js
      - run: sleep 61
      - name: Modules sans test direct (transferts, rapports, recherche, QR codes, signalements)
        run: node scripts/functional7.js
      - run: sleep 61
      - name: Recette des 15 profils (droits de consultation vérifiés côté serveur)
        run: |
          node scripts/profils15.js
          cat profils15-matrice.md
      - run: sleep 61
      - run: node scripts/smoke.js
      - name: Migrations — historique, retour arrière puis réapplication
        run: |
          node dist/migrations/cli.js status
          node dist/migrations/cli.js down 0005
          node dist/migrations/cli.js down 0004
          node dist/migrations/cli.js down 0003
          node dist/migrations/cli.js status
          node dist/migrations/cli.js up
          node dist/migrations/cli.js status
      - name: Audit comptable (lecture seule)
        run: node scripts/audit-comptable.js
      - if: failure()
        run: tail -80 server.log
