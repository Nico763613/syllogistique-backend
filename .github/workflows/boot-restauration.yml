name: Paquet de démarrage (test sur copie restaurée)
# Lancé uniquement par un envoi sur la branche « test/boot-restauration ».
# Construit l'application (avec les moteurs Prisma pour Linux) et la publie comme artefact,
# pour la démarrer ensuite dans l'environnement de recette contre une COPIE restaurée de la base.
# Aucun secret ni aucune base réelle n'est utilisé ici.
on:
  push:
    branches: [test/boot-restauration]
jobs:
  paquet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run build
      - run: tar czf paquet.tgz dist public node_modules/.prisma node_modules/@prisma node_modules/prisma
      - uses: actions/upload-artifact@v4
        with:
          name: paquet-demarrage
          path: paquet.tgz
          retention-days: 2
